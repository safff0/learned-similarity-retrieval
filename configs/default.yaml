data:
  partitions:
    train:
      name: ExampleDataset    # class name; @register("dataset") decorator key
      partition: train
      input_length: 1024
      n_classes: 10
      dataset_length: 100
    val:
      name: ExampleDataset
      partition: val
      input_length: 1024
      n_classes: 10
      dataset_length: 50
  dataloader:
    batch_size: 10
    num_workers: 2
    pin_memory: true

model:
  name: BaselineModel         # @register("model") decorator key
  n_feats: 1024
  fc_hidden: 512
  n_class: 10

optimizer:
  name: Adam                  # class in torch.optim (Adam | SGD | AdamW | ...)
  lr: 3.0e-4

metrics:
  device: auto
  train: []
  inference: []

trainer:
  device: auto                          # auto | cuda | cpu
  seed: 1
  n_epochs: 10
  epoch_len: null                       # null = epoch-based; int = iter-based
  log_step: 50
  save_period: 5
  save_dir: ./saved/default
  tb_dir: ./runs/default
  device_tensors: [data_object, labels]
  loss_names: [loss]
  max_grad_norm: null
